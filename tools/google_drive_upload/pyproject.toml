[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "google-drive-upload"
version = "0.1.0"
description = "Authenticate to Google Drive and upload local files"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client==2.187.0",
    "google-auth-oauthlib==1.2.2",
]

[project.scripts]
google-drive-upload = "google_drive_upload.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
