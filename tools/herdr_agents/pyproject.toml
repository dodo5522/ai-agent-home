[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-agents"
version = "0.1.0"
description = "Manage exact-name Herdr Agents"
requires-python = ">=3.14"
dependencies = ["herdr-runtime"]

[project.scripts]
herdr-agents = "herdr_agents.persistent.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.10",
]

[tool.uv.sources]
herdr-runtime = { path = "../herdr_runtime" }

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
