[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-task-state"
version = "0.1.0"
description = "Versioned, locked state for Herdr Issue tasks"
requires-python = ">=3.14"
dependencies = [
    "pydantic==2.12.5",
]

[project.scripts]
herdr-task-state = "herdr_task_state.cli:main"

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
